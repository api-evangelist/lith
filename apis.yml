aid: lith
name: Lithium Finance
description: >-
  Lithium Finance is a decentralized asset-pricing protocol that combines machine
  learning with collective intelligence to value illiquid assets, with an initial
  focus on NFTs. Quantitative models analyze historical trading data to produce a
  base valuation and to flag cases where machine learning struggles — such as rare
  NFTs with little trading history — and the protocol then incentivizes a community
  of Price Experts to submit pricing estimates through on-chain Pricing Quests. Two
  ecosystem roles drive the network: Price Seekers (data consumers such as projects,
  lenders, issuers and analysts) fund prize pools to post asset-pricing enquiries,
  and Price Experts (brokers, traders and market participants) answer them for
  bounties. The economy runs on the LITH token plus non-transferable Reputation
  Points, and the protocol is governed by the Lithium DAO via Snapshot. The public
  surface is a set of Solidity Enquiry Pool, Reputation and LITH token contracts
  rather than a hosted web API.
